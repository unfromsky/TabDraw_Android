name: Build TabDraw APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: List Generated APK Files
      run: |
        echo "=== Locating built APK files ==="
        find app/build/outputs/apk/ -type f -name "*.apk" || ls -laR app/build/outputs/

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TabDraw-Android-APK
        path: app/build/outputs/apk/**/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "TabDraw 繪圖板 Android App v1.0.${{ github.run_number }}"
        body: |
          ### 🎨 TabDraw 平板繪圖板 Android 專屬客戶端

          - ⚡ **強制 120Hz 滿血刷新率**：徹底解決 HyperOS 鎖 60Hz 與畫圓變多邊形問題。
          - ✍️ **手寫筆空中懸浮支援**：原生傳遞筆尖懸浮與壓感訊號，打破 Chrome 300ms 掐斷保護。
          - 🔄 **休眠喚醒自動重連**：平板熄滅再亮起立即無縫連線，不失效、不卡頓。
          - 🌐 **自由切換 IP**：支援自訂與記憶電腦端 IP（預設帶入 `192.168.0.13:3000`）。
          - 📺 **全螢幕沉浸式模式**：隱藏狀態列與虛擬導航列，螢幕常亮不中斷繪圖。
        files: app/build/outputs/apk/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
